<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATUS - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-card .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card .logo-area h1 {
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 1px;
            margin: 0;
        }
        .login-card .logo-area .sub {
            color: #7f8c8d;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .login-card .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
        }
        .login-card .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }
        .btn-login {
            background: #2c3e50;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            border: none;
            transition: 0.2s;
        }
        .btn-login:hover {
            background: #1a2a3a;
            color: #fff;
        }
        .btn-login i {
            margin-right: 8px;
        }
        .login-card .links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .login-card .links a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        .login-card .links a:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 8px;
        }
        .helptext {
            font-size: 0.75rem;
            color: #7f8c8d;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <h1>TATUS</h1>
            <div class="sub">LOGISTICA</div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuário</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Escolha um nome" required>
            </div>
            <div class="mb-3">
                <label for="password1" class="form-label fw-semibold">Senha</label>
                <input type="password" class="form-control" id="password1" name="password1" placeholder="Crie uma senha" required>
                <span class="helptext">Mínimo de 8 caracteres. Não pode ser só números.</span>
            </div>
            <div class="mb-3">
                <label for="password2" class="form-label fw-semibold">Confirmar senha</label>
                <input type="password" class="form-control" id="password2" name="password2" placeholder="Digite a senha novamente" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-person-plus"></i> Criar Conta
            </button>
        </form>

        <div class="links">
            Já tem uma conta? <a href="{% url 'login' %}">Faça Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
